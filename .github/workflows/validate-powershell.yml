name: Validate PowerShell Repository

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate scripts, metadata, and catalog
    runs-on: windows-latest

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository validation
        shell: pwsh
        run: .\tools\Test-Repository.ps1

      - name: Verify Intune workload contracts
        shell: pwsh
        run: .\tools\Test-IntuneWorkloadContracts.ps1

      - name: Verify generated catalog is current
        shell: pwsh
        run: .\tools\Update-ScriptCatalog.ps1 -Check

      - name: Verify detection evidence metadata is current
        shell: pwsh
        run: .\tools\Test-DetectionEvidence.ps1 -Check

      - name: Verify script portability metadata and baseline are current
        shell: pwsh
        run: .\tools\Test-ScriptPortability.ps1 -Check
