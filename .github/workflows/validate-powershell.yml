name: Validate PowerShell Repository

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      enable_smoke:
        description: Run all eligible read-only detection/discovery smoke tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structured Intune validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Pester
        shell: pwsh
        run: |
          $requiredVersion = [version]'5.9.0'
          $installed = Get-Module -ListAvailable -Name Pester |
            Where-Object Version -eq $requiredVersion |
            Select-Object -First 1
          if ($null -eq $installed) {
            Install-Module -Name Pester -RequiredVersion $requiredVersion -Scope CurrentUser -Force -SkipPublisherCheck
          }
          Import-Module Pester -RequiredVersion $requiredVersion -Force
          if ((Get-Module Pester).Version -ne $requiredVersion) {
            throw "Pester $requiredVersion is required."
          }

      - name: Run structured validation
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_SMOKE: ${{ inputs.enable_smoke }}
        run: |
          $parameters = @{
            OutputRoot = Join-Path $PWD 'output\validation'
            CI = $true
          }

          switch ($env:EVENT_NAME) {
            'pull_request' {
              $parameters.Scope = 'Changed'
              $parameters.BaseRef = $env:PR_BASE_SHA
              $parameters.HeadRef = $env:PR_HEAD_SHA
            }
            'push' {
              $parameters.Scope = 'Full'
              $parameters.BaseRef = $env:PUSH_BASE_SHA
              $parameters.HeadRef = $env:CURRENT_SHA
              $parameters.EnableSmoke = $true
            }
            'schedule' {
              $parameters.Scope = 'Full'
              $parameters.HeadRef = $env:CURRENT_SHA
            }
            'workflow_dispatch' {
              $parameters.Scope = 'Full'
              $parameters.HeadRef = $env:CURRENT_SHA
              if ($env:MANUAL_SMOKE -eq 'true') {
                $parameters.EnableSmoke = $true
              }
            }
            default {
              throw "Unsupported event '$($env:EVENT_NAME)'."
            }
          }

          .\tools\Invoke-Validation.ps1 @parameters

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}
          path: output/validation
          if-no-files-found: error
          retention-days: 14
